<script>
const S = { db: null, dl: null, rooms: {}, months: {}, overlay: {}, tab: 'month', sel: null,

S.mode = 'auto'; S.mfilter = 'all'; S.open = {};
S.sample = null; S.cam = false; S.ocrFloor = false; S.ocr = {}; S.photoFor = null; S.photoRoom = null; S.busyRoom = null; S.settings = {};
S.setup = false; S.ghError = '';
try { S.tab = localStorage.getItem('tab') || 'month'; S.sel = localStorage.getItem('sel'); S.mode = localStorage.getItem('mode') || 'auto'; } catch (e) {}
// 'auto' picks the phone layout on narrow screens; the header button pins one layout.
const mobile = () => S.mode === 'mobile' || (S.mode === 'auto' && innerWidth < 760);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function merge(a, b) { const o = { ...a }; for (const k in b) o[k] = isObj(b[k]) && isObj(o[k]) ? merge(o[k], b[k]) : b[k]; return o; }
const fmt = n => n == null || Number.isNaN(n) ? '—' : Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 1 });
const money = n => n == null ? '—' : '$' + fmt(n);

const ymLabel = l => { const m = /^(\d+)-(\d+)(.*)$/.exec(l || ''); return m ? `${+m[1]} 年 ${+m[2]} 月${m[3] ? ' ' + m[3].replace(/^-/, '') : ''}` : l; };
const md = d => d ? d.slice(5).replace('-', '/') : '?';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

const roomList = () => Object.values(S.rooms).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.id.localeCompare(b.id));
const monthList = () => Object.entries(S.months).map(([id, d]) => ({ id, ...d })).sort((a, b) => (b.sort || 0) - (a.sort || 0));
const getMonth = id => S.months[id] ? (S.overlay[id] ? merge(S.months[id], S.overlay[id]) : S.months[id]) : null;
const isRegular = l => /^\d+-\d{2}$/.test(l);

/* ---------- billing rules (same as the Excel sheet) ---------- */
// 1F+3F public meters are shared per head across rooms with shareMain;
// the 2F public meter is shared per head across rooms with shareF2.
function compute(m) {
  const ids = Object.keys(m.rows || {}).sort((a, b) => (m.rows[a].order ?? 999) - (m.rows[b].order ?? 999));
  const rows = ids.map(id => ({ id, ...m.rows[id] }));
  let mainUse = 0, f2Use = 0, mainPpl = 0, f2Ppl = 0, missing = 0, mainMissing = false, f2Missing = false;
  for (const r of rows) {
    if (r.kind === 'public') {
      if (r.cur == null) { missing++; r.pool === 'f2' ? f2Missing = true : mainMissing = true; continue; }
      r.use = r.cur - r.prev;
      if (r.pool === 'f2') f2Use += r.use; else mainUse += r.use;
    } else {
      if (r.shareMain) mainPpl += +r.people || 0;
      if (r.shareF2) f2Ppl += +r.people || 0;
    }
  }
  const perMain = mainMissing ? null : mainPpl ? Math.round(mainUse / mainPpl) : 0;
  const perF2 = f2Missing ? null : f2Ppl ? Math.round(f2Use / f2Ppl) : 0;
  const sum = { elec: 0, water: 0, rent: 0, adj: 0, total: 0, received: 0, paid: 0, unpaid: 0, nPaid: 0, nBill: 0 };
  for (const r of rows) {
    if (r.kind === 'public') continue;
    const ppl = +r.people || 0;
    r.water = ppl * (+r.waterPer || 0);
    if (r.kind === 'flat') { r.elec = 0; r.units = null; }
    else {
      if (r.cur == null) { missing++; r.own = null; } else r.own = r.cur - r.prev;
      const needMain = r.shareMain && ppl, needF2 = r.shareF2 && ppl;
      r.share = (needMain && perMain == null) || (needF2 && perF2 == null) ? null
        : (needMain ? ppl * perMain : 0) + (needF2 ? ppl * perF2 : 0);
      r.units = r.own == null || r.share == null ? null : r.own + r.share;
      r.elec = r.units == null ? null : Math.round(r.units * (+r.rate || 0));
    }
    r.pending = r.elec == null;
    r.total = Math.round((r.elec || 0) + r.water + (+r.rent || 0) + (+r.adj || 0));
    r.billable = !!(r.tenant || ppl || +r.rent);
    // 實收: the amount actually charged after the landlord's own adjustment; blank = same as 合計.
    r.due = r.received != null && r.received !== '' ? +r.received : r.total;
    sum.elec += r.elec || 0; sum.water += r.water; sum.rent += +r.rent || 0; sum.adj += +r.adj || 0; sum.total += r.total; sum.received += r.due;
    if (r.billable) { sum.nBill++; if (r.paid) { sum.paid += r.due; sum.nPaid++; } else sum.unpaid += r.due; }
  }
  return { rows, perMain, perF2, mainUse, f2Use, mainPpl, f2Ppl, missing, sum };
}
function archiveSum(m) {
  const s = { elec: 0, water: 0, rent: 0, total: 0, received: 0, hasRecv: false };
  for (const r of m.rows || []) {
    if (r.tenant === '公電') continue;
    s.elec += r.elec || 0; s.water += r.water || 0; s.rent += r.rent || 0; s.total += r.total || 0;
    if (r.received != null) { s.received += r.received; s.hasRecv = true; }

  return s;
}
const monthTotal = m => m.archived ? archiveSum(m).total : compute(m).sum.total;

/* ---------- utility bills vs. what tenants paid ---------- */
// Taipower bills each floor separately and both utilities bill every two months, so a bill
// entered on a month is compared with that month plus the months before it (span).
// B436 has its own Taipower meter, so its electricity is left out; its water is included.
const UT_KEYS = [['e1', '一樓電費'], ['e2', '二樓電費'], ['e3', '三樓電費'], ['w', '水費']];
function collected(m) {
  const out = { e1: 0, e2: 0, e3: 0, w: 0, missing: 0 };
  if (m.archived) {
    for (const r of m.rows || []) {
      if (r.tenant === '公電' || !/^B\d/.test(r.room || '')) continue;
      const f = r.room[1];
      if (r.room !== 'B436' && '123'.includes(f)) out['e' + f] += r.elec || 0;
      out.w += r.water || 0;
    }
  } else {
    const c = compute(m); out.missing = c.missing;
    for (const r of c.rows) {

/* ---------- writes: one in flight per month doc, coalesced ---------- */
const W = {};
function patchMonth(id, patch) {
  S.overlay[id] = merge(S.overlay[id] || {}, patch);
  const w = W[id] ||= { pending: null, busy: false, t: 0 };
  w.pending = merge(w.pending || {}, patch);
  clearTimeout(w.t); w.t = setTimeout(() => flush(id), 500);
  render();
}
async function flush(id) {
  const w = W[id]; if (!w || !w.pending) return;
  if (w.busy) { w.t = setTimeout(() => flush(id), 300); return; }
  const p = w.pending; w.pending = null; w.busy = true;
  try { await S.db.doc('months/' + id).update(p); }
  catch (e) { toast('儲存失敗：' + (e.message || e.code) + '，請重新整理後再試'); }
  w.busy = false;
  if (!w.pending) { delete S.overlay[id]; render(); }
}

  th: { hi: 'สวัสดี', rentOnly: p => `ค่าเช่าเดือน${MONTHS.th[p.m - 1]} ${p.y}`, both: p => `ค่าเช่าเดือน${MONTHS.th[p.m - 1]} ${p.y} และค่าน้ำค่าไฟเดือน${MONTHS.th[p.um - 1]} ${p.uy}`,
    room: 'ห้อง', elec: 'ค่าไฟ', water: 'ค่าน้ำ', rent: 'ค่าเช่า', other: 'อื่นๆ', disc: 'ส่วนลด', total: 'รวม', owner: 'เจ้าของบ้าน', pending: 'ยังไม่ได้จด' },
};
function billPeriod(label) {
  const [ry, rm] = label.split('-').map(Number), y = (ry < 100 ? ry + 100 : ry) + 1911;
  return { y, m: rm, uy: rm === 1 ? y - 1 : y, um: rm === 1 ? 12 : rm - 1 };
}
function noticeFor(m, roomId) {
  let d;
  if (m.archived) {
    const r = (m.rows || []).find(x => x.room === roomId); if (!r) return '';
    const cfg = S.rooms[roomId] || {};
    d = { tenant: r.tenant || '', flat: r.prev == null && !r.elec, elec: r.elec ?? 0, water: r.water ?? 0, rent: r.rent ?? 0, adj: 0, total: r.total ?? 0,
      lang: cfg.tenant && cfg.tenant === r.tenant ? cfg.nationality : 'tw' };
  } else {
    const r = compute(m).rows.find(x => x.id === roomId); if (!r) return '';
    d = { tenant: r.tenant || '', flat: r.kind === 'flat', elec: r.pending ? null : r.elec, water: r.water, rent: +r.rent || 0, adj: +r.adj || 0,
      adjNote: r.adjNote, total: r.due, lang: S.rooms[roomId]?.nationality };
  }
  const p = billPeriod(m.label), name = S.rooms[roomId]?.billName || roomId;
  const owner = [S.settings.landlordName, S.settings.landlordPhone].filter(Boolean).join(' ');
  const n = v => String(Math.round(v));
  const block = L => {
    const elec = `${L.elec}: ${d.elec == null ? L.pending : n(d.elec)}`, water = `${L.water}: ${n(d.water)}`;
    return [L.hi, d.flat ? L.rentOnly(p) : L.both(p), `${L.room}: ${name} ${d.tenant}`.trim(),
      ...(d.flat ? [water, elec] : [elec, water]), `${L.rent}: ${n(d.rent)}`,
      d.adj ? `${d.adj > 0 ? L.other : L.disc}: ${n(d.adj)}${d.adjNote ? ` (${d.adjNote})` : ''}` : null,
      `${L.total}: ${n(d.total)}`, owner ? `${L.owner}: ${owner}` : null].filter(Boolean).join('\n');
  };
  const lang = LANG[d.lang] && d.lang !== 'tw' ? d.lang : null;
  return block(LANG.tw) + (lang ? '\n\n' + block(LANG[lang]) : '');
}

function drawChart() {
  const box = $('#chart'); if (!box) return;
  let ms = monthList().filter(m => isRegular(m.label)).reverse();
  if (!S.showAll) ms = ms.slice(-36);
  const data = ms.map(m => ({ id: m.id, label: m.label, v: monthTotal(m), live: !m.archived }));
  const W = Math.max(300, box.clientWidth - 28), H = 230, padL = 44, padB = 26, padT = 18;
  const max = Math.max(1, ...data.map(d => d.v));
  const step = max > 100000 ? 40000 : 20000, top = Math.ceil(max / step) * step;
  const y = v => padT + (H - padT - padB) * (1 - v / top);
  const bw = (W - padL) / data.length, w = Math.max(2, bw - 2);
  let g = '';
  for (let t = 0; t <= top; t += step) g += `<line x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t / 10000} 萬</text>`;
  data.forEach((d, i) => {
    const x = padL + i * bw + 1, yy = y(d.v), h = y(0) - yy, r = Math.min(4, w / 2, h);
    const path = h > 0 ? `M${x},${y(0)}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + w - r}Q${x + w},${yy} ${x + w},${yy + r}V${y(0)}Z` : '';
    g += `<path d="${path}" fill="var(--accent)" opacity="${d.live ? 0.55 : 1}"/>`;
    g += `<rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent" data-i="${i}" data-act="open" data-id="${esc(d.id)}" style="cursor:pointer"/>`;
    if (/-01$/.test(d.label) || i === 0) g += `<text x="${x}" y="${H - 8}" font-size="11" fill="var(--muted)">${d.label.split('-')[0]} 年</text>`;
  });
  const last = data[data.length - 1];
  if (last) g += `<text x="${padL + (data.length - 1) * bw + bw / 2}" y="${y(last.v) - 5}" text-anchor="end" font-size="11" fill="var(--ink)" class="num">${fmt(last.v)}</text>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月應收合計長條圖">${g}</svg><div class="tip" hidden></div>`;
  const tip = box.querySelector('.tip');
  box.querySelectorAll('rect[data-i]').forEach(rc => {
    rc.addEventListener('mouseenter', () => {
      const d = data[+rc.dataset.i];
      tip.innerHTML = `${esc(ymLabel(d.label))}${d.live ? '（記帳中）' : ''}<br><b class="num">$${fmt(d.v)}</b>`;
      tip.hidden = false;
      const k = (box.clientWidth - 28) / W;
      tip.style.left = Math.min(Math.max(60, 14 + (+rc.getAttribute('x') + bw / 2) * k), box.clientWidth - 60) + 'px';
      tip.style.top = (8 + y(d.v) * k - 4) + 'px';
    });
    rc.addEventListener('mouseleave', () => tip.hidden = true);
  });
}

async function createNextMonth() {
  const ms = monthList(), base = ms[0];
  const label = base ? nextLabel(base.label) : (() => { const d = new Date(); return `${d.getFullYear() - 1911}-${String(d.getMonth() + 1).padStart(2, '0')}`; })();
  if (S.months[label]) { toast(ymLabel(label) + ' 已經存在'); return; }
  const rows = {};
  for (const r of roomList()) {
    let prev = null;
    if (base?.archived) prev = (base.rows || []).find(x => x.room === r.id)?.cur ?? null;
    else if (base) { const b = getMonth(base.id).rows?.[r.id]; prev = b ? (b.cur ?? b.prev ?? null) : null; }
    rows[r.id] = { order: r.order, kind: r.kind, pool: r.pool ?? null, tenant: r.tenant || '', people: +r.people || 0, rent: +r.rent || 0,
      rate: +r.rate || 0, waterPer: +r.waterPer || 0, shareMain: !!r.shareMain, shareF2: !!r.shareF2,
      prev: r.kind === 'flat' ? null : prev, cur: null, adj: 0, adjNote: '', paid: false, paidOn: '' };
  }
  const [y, mo] = label.split('-').map(Number);
  const doc = { label, sort: y * 10000 + mo * 100 + 99, archived: false, from: base?.to || '', to: '', rows };
  try { await S.db.doc('months/' + label).set(doc); S.sel = label; save('sel', label); S.confirm = null; S.ocr = {}; toast('已建立 ' + ymLabel(label)); }
  catch (e) { toast('建立失敗：' + (e.message || e.code)); }
}

    case 'pay': { const r = getMonth(S.sel).rows[room]; patchMonth(S.sel, { rows: { [room]: { paid: !r.paid, paidOn: r.paid ? '' : today() } } }); break; }
    case 'bill': S.bill = room; render(); break;
    case 'close-bill': S.bill = null; render(); break;
    case 'copy': { const txt = $('#bill-text').textContent;
      try { await navigator.clipboard.writeText(txt); toast('已複製'); S.bill = null; render(); }
      catch (err) { const r = document.createRange(); r.selectNodeContents($('#bill-text')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('已選取文字，請按複製'); } break; }
    case 'open': S.sel = t.dataset.id; save('sel', S.sel); S.tab = 'month'; save('tab', 'month'); S.ocr = {}; render(); scrollTo(0, 0); break;
    case 'range': S.showAll = !S.showAll; render(); break;

document.addEventListener('input', e => {

async function exportCsv() {
  const m = getMonth(S.sel); if (!m) return;

  if (m.archived) {
    head = ['房號', '房客', '人數', '上期', '本期', '計費度數', '電費', '水費', '房租', '合計'];
    lines = (m.rows || []).map(r => [r.room, r.tenant, r.people, r.prev, r.cur, r.units, r.elec, r.water, r.rent, r.total]);
  } else {
    const c = compute(m);
    head = ['房號', '房客', '人數', '上期', '本期', '自用度數', '公電度數', '計費度數', '電費', '水費', '房租', '合計', '實收', '收款'];
    lines = c.rows.map(r => r.kind === 'public' ? [r.id, r.tenant, '', r.prev, r.cur, r.use, '', '', '', '', '', '', '', '']
      : [r.id, r.tenant, r.people, r.prev, r.cur, r.own, r.share, r.units, r.elec, r.water, r.rent, r.total, r.billable ? r.due : '', r.paid ? '已收 ' + r.paidOn : '未收']);
  }
  const csv = '﻿' + [head, ...lines].map(l => l.map(v => { v = v ?? ''; return /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v; }).join(',')).join('\r\n');
  if (!S.dl) { toast('這個檢視無法下載檔案'); return; }
  try { await S.dl.save({ filename: `房租-${m.label}.csv`, data: csv }); } catch (err) { if (err?.code !== 'cancelled') toast('下載沒有完成'); }
}

/* ---------- Excel export: every month as its own sheet, with formulas ---------- */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = rej; document.head.appendChild(s);
  });
}
const cell = (v, f) => {
  const c = v == null || v === '' ? { t: 's', v: '' } : typeof v === 'number' ? { t: 'n', v } : typeof v === 'boolean' ? { t: 'b', v } : { t: 's', v: String(v) };
  if (f) c.f = f;
  return c;
};
function sheetFromGrid(X, grid) {   // grid: {A1: cell}
  let maxR = 0, maxC = 0;
  for (const ref in grid) { const a = X.utils.decode_cell(ref); maxR = Math.max(maxR, a.r); maxC = Math.max(maxC, a.c); }
  grid['!ref'] = X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
  return grid;
}
function archiveSheet(X, m) {
  const g = {};
  if (m.cells) {
    for (const ref in m.cells) {
      const [v, f] = m.cells[ref];
      g[ref] = cell(v, f);
      if (/^[A-Z]+1$/.test(ref) && typeof v === 'number' && v > 30000) g[ref].z = 'yyyy/m/d';
    }
  } else {
    const head = ['房號', '姓名', '人數', '上期', '本期', '計費度數', '電費', '水費', '房租', '合計'];
    head.forEach((h, i) => g[X.utils.encode_cell({ r: 0, c: i })] = cell(h));
    (m.rows || []).forEach((r, i) => [r.room, r.tenant, r.people, r.prev, r.cur, r.units, r.elec, r.water, r.rent, r.total]
      .forEach((v, c) => g[X.utils.encode_cell({ r: i + 1, c })] = cell(v)));
  }
  const ws = sheetFromGrid(X, g);
  ws['!cols'] = [{ wch: 7 }, { wch: 12 }, { wch: 6 }, { wch: 10 }, { wch: 10 }, { wch: 8 }, { wch: 9 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 9 }, { wch: 24 }, { wch: 14 }];
  return ws;
}
function liveSheet(X, m) {
  const c = compute(m), rows = c.rows, n = rows.length, last = n + 1, g = {};
  const put = (ref, v, f) => g[ref] = cell(v, f);
  ['房號', '姓名', '人數', '上期度數', '本期度數', '自用度數', '公電度數', '計費度數', '電費', '水費', '房租', '加減', '合計', '收款',
    '電費單價', '每人水費', '分攤1F+3F公電', '分攤2F公電', '加減說明', '實收'].forEach((h, i) => put(X.utils.encode_cell({ r: 0, c: i }), h));
  const S0 = n + 4;                       // summary block starts two rows below the totals row
  const R = { mainUse: S0, mainPpl: S0 + 1, perMain: S0 + 2, f2Use: S0 + 3, f2Ppl: S0 + 4, perF2: S0 + 5, paid: S0 + 6, unpaid: S0 + 7, period: S0 + 8 };
  const mainRefs = [], f2Refs = [];
  rows.forEach((r, i) => {
    const x = i + 2;
    put('A' + x, r.id); put('B' + x, r.tenant || '');
    if (r.kind === 'public') {
      put('D' + x, r.prev); put('E' + x, r.cur);
      put('F' + x, r.use ?? '', `IF(E${x}="","",E${x}-D${x})`);
      (r.pool === 'f2' ? f2Refs : mainRefs).push('F' + x);
      return;
    }
    put('C' + x, +r.people || 0);
    if (r.kind !== 'flat') {
      put('D' + x, r.prev); put('E' + x, r.cur);
      put('F' + x, r.own ?? '', `IF(E${x}="","",E${x}-D${x})`);
      put('G' + x, r.share ?? 0, `C${x}*(Q${x}*$F$${R.perMain}+R${x}*$F$${R.perF2})`);
      put('H' + x, r.units ?? '', `IF(F${x}="","",F${x}+G${x})`);
      put('I' + x, r.elec ?? 0, `IF(H${x}="",0,ROUND(H${x}*O${x},0))`);
      put('O' + x, +r.rate || 0); put('Q' + x, r.shareMain ? 1 : 0); put('R' + x, r.shareF2 ? 1 : 0);
    } else put('I' + x, 0);
    put('J' + x, r.water, `C${x}*P${x}`);
    put('K' + x, +r.rent || 0); put('L' + x, +r.adj || 0);
    put('M' + x, r.total, `ROUND(I${x}+J${x}+K${x}+L${x},0)`);
    put('N' + x, r.billable ? (r.paid ? '已收 ' + (r.paidOn || '') : '未收') : '');
    put('P' + x, +r.waterPer || 0); put('S' + x, r.adjNote || '');
    if (r.billable) put('T' + x, r.due, r.received != null && r.received !== '' ? null : `M${x}`);
  });
  const tr = n + 2;
  put('A' + tr, '合計'); put('C' + tr, rows.reduce((a, r) => a + (r.kind === 'public' ? 0 : +r.people || 0), 0), `SUM(C2:C${last})`);
  for (const [col, k] of [['I', 'elec'], ['J', 'water'], ['K', 'rent'], ['L', 'adj'], ['M', 'total'], ['T', 'received']]) put(col + tr, c.sum[k], `SUM(${col}2:${col}${last})`);
  const label = (r, t) => put('A' + r, t);
  label(R.mainUse, '1F+3F 公電度數'); put('F' + R.mainUse, c.mainUse, mainRefs.length ? `SUM(${mainRefs.join(',')})` : null);
  label(R.mainPpl, '1F+3F 分攤人數'); put('F' + R.mainPpl, c.mainPpl, `SUMPRODUCT(C2:C${last},Q2:Q${last})`);
  label(R.perMain, '1F+3F 每人分攤度數'); put('F' + R.perMain, c.perMain ?? 0, `IF(F${R.mainPpl}=0,0,ROUND(F${R.mainUse}/F${R.mainPpl},0))`);
  label(R.f2Use, '2F 公電度數'); put('F' + R.f2Use, c.f2Use, f2Refs.length ? `SUM(${f2Refs.join(',')})` : null);
  label(R.f2Ppl, '2F 分攤人數'); put('F' + R.f2Ppl, c.f2Ppl, `SUMPRODUCT(C2:C${last},R2:R${last})`);
  label(R.perF2, '2F 每人分攤度數'); put('F' + R.perF2, c.perF2 ?? 0, `IF(F${R.f2Ppl}=0,0,ROUND(F${R.f2Use}/F${R.f2Ppl},0))`);
  label(R.paid, '已收金額'); put('F' + R.paid, c.sum.paid, `SUMIF(N2:N${last},"已收*",T2:T${last})`);
  label(R.unpaid, '未收金額'); put('F' + R.unpaid, c.sum.unpaid, `SUMIF(N2:N${last},"未收",T2:T${last})`);
  label(R.period, '抄表期間'); put('F' + R.period, `${m.from || '?'} → ${m.to || '?'}`);
  const ws = sheetFromGrid(X, g);
  ws['!cols'] = [{ wch: 16 }, { wch: 12 }, { wch: 6 }, { wch: 10 }, { wch: 10 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 8 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 16 },
    { wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 10 }, { wch: 20 }, { wch: 10 }];
  return ws;
}
async function exportXlsx() {
  if (S.xlsxBusy) return;
  if (!S.dl) { toast('這個檢視無法下載檔案'); return; }
  S.xlsxBusy = true; render();
  try {
    const X = await loadXLSX();
    const wb = X.utils.book_new(), used = new Set();
    const nameOf = raw => {
      let s = String(raw).replace(/[\\/?*\[\]:]/g, '_').slice(0, 31), k = 2;
      while (used.has(s)) s = (String(raw).slice(0, 27) + '(' + k++ + ')');
      used.add(s); return s;
    };
    const ms = monthList();
    for (const m of ms) X.utils.book_append_sheet(wb, m.archived ? archiveSheet(X, m) : liveSheet(X, m), nameOf(m.sheet || m.label));
    const sum = [['月份', '抄表起', '抄表迄', '電費', '水費', '房租', '合計', '來源']];
    for (const m of ms.filter(m => isRegular(m.label))) {
      const s = m.archived ? archiveSum(m) : compute(m).sum;
      sum.push([m.label, m.from || '', m.to || '', s.elec, s.water, s.rent, s.total, m.archived ? 'Excel 匯入' : '網頁記帳']);
    }
    const ws1 = X.utils.aoa_to_sheet(sum); ws1['!cols'] = [{ wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 9 }, { wch: 10 }, { wch: 11 }, { wch: 11 }];
    X.utils.book_append_sheet(wb, ws1, nameOf('歷年總覽'));
    const ut = [['帳單月份', '涵蓋月份', '項目', '計費期間', '帳單金額', '向房客收', '盈虧']];
    for (const { m, p } of utilityRecords()) for (const r of p.rows) if (r.bill != null) {
      const i = ut.length + 1;
      ut.push([m.label, p.months.map(x => x.label).join('、'), r.name, r.period, r.bill, r.got, { t: 'n', v: r.pl, f: `F${i}-E${i}` }]);
    }
    if (ut.length > 1) {
      const n = ut.length;
      ut.push(['合計', '', '', '', { t: 'n', v: 0, f: `SUM(E2:E${n})` }, { t: 'n', v: 0, f: `SUM(F2:F${n})` }, { t: 'n', v: 0, f: `SUM(G2:G${n})` }]);
    }
    const ws3 = X.utils.aoa_to_sheet(ut); ws3['!cols'] = [{ wch: 10 }, { wch: 16 }, { wch: 10 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 10 }];
    X.utils.book_append_sheet(wb, ws3, nameOf('水電盈虧'));
    const rs = [['房號', '房客', '人數', '房租', '押金', '入住日', '電話', '電費單價', '每人水費', '分攤1F+3F公電', '分攤2F公電', '備註']];
    for (const r of roomList()) if (r.kind !== 'public') rs.push([r.id, r.tenant || '', +r.people || 0, +r.rent || 0, +r.deposit || 0, r.moveIn || '', r.phone || '', r.kind === 'flat' ? '' : +r.rate || 0, +r.waterPer || 0, r.shareMain ? '是' : '', r.shareF2 ? '是' : '', r.note || '']);
    const ws2 = X.utils.aoa_to_sheet(rs); ws2['!cols'] = [{ wch: 7 }, { wch: 12 }, { wch: 6 }, { wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 14 }, { wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 10 }, { wch: 30 }];
    X.utils.book_append_sheet(wb, ws2, nameOf('房客資料'));
    const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
    await S.dl.save({ filename: `房租帳本-${today()}.xlsx`, data: buf });
  } catch (err) {
    if (err?.code !== 'cancelled') toast(err?.code ? '下載沒有完成' : '產生 Excel 失敗，請再試一次');
  }
  S.xlsxBusy = false; render();
}

/* ---------- boot ---------- */
(async () => {
  const [db, dl, sm] = await Promise.all(['db', 'downloads', 'sample'].map(n => window.claude?.use?.(n) ?? null));
  S.dl = dl;
  if (sm) {
    S.sample = sm;
    sm.limits().then(l => {
      S.cam = !!l?.images;
      S.ocrFloor = l?.floor !== false;
      if (S.cam) $('#photo-in').accept = l.images.mediaTypes.join(',');
      render();
    }).catch(() => {});
  }
  if (!db) {
    S.dbMissing = true;
    S.ghError = window.rentGh?.lastError || '';
    if (!window.rentGh?.config?.().token) S.setup = true;   // first run: open the connection dialog
    $('#sync').textContent = '未連線'; render(); return;
  }
  S.db = db;
  const fail = err => { $('#sync').textContent = '連線中斷，請重新整理'; };
  db.collection('rooms').onSnapshot(snap => {
    S.rooms = {}; snap.docs.forEach(d => S.rooms[d.id] = { id: d.id, ...d.data() });
    S.ready.rooms = true; $('#sync').textContent = '已同步'; if (!(S.tab === 'rooms' && S.dirty)) render();
  }, fail);
  db.doc('config/settings').onSnapshot(snap => {
    S.settings = snap.exists ? snap.data() : {};
    if (!(S.tab === 'rooms' && S.dirty)) render();
  }, fail);
  db.collection('months').onSnapshot(snap => {
    S.months = {}; snap.docs.forEach(d => S.months[d.id] = d.data());
    S.ready.months = true; $('#sync').textContent = '已同步'; if (!(S.tab === 'rooms' && S.dirty)) render();
  }, fail);
})();
render();
