name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - github-db.js
      - meter-ocr.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the static app. db/ (tenant names, phones, rent) is
      # intentionally NOT copied, even though the repo is private.
      - name: Build _site
        run: |
          mkdir -p _site
          cp index.html github-db.js meter-ocr.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
